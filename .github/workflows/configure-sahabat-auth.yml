name: Configure Sahabat Familia Auth

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/configure-sahabat-auth.yml"
      - "sahabat/email-templates/**"

permissions:
  contents: read

concurrency:
  group: configure-sahabat-familia-auth
  cancel-in-progress: false

jobs:
  configure:
    name: Apply URL and email branding to Supabase Auth
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PROJECT_REF: cvfuuflnfexaqnncgjmw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SMTP_HOST: ${{ secrets.SAHABAT_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SAHABAT_SMTP_PORT }}
      SMTP_USER: ${{ secrets.SAHABAT_SMTP_USER }}
      SMTP_PASS: ${{ secrets.SAHABAT_SMTP_PASS }}
      SMTP_ADMIN_EMAIL: ${{ secrets.SAHABAT_SMTP_ADMIN_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate management credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured."
            echo "Create a Supabase personal access token with auth_config_write/project_admin_write, save it as SUPABASE_ACCESS_TOKEN, then re-run this workflow."
            exit 1
          fi

      - name: Build safe Auth configuration payload
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --rawfile confirmation sahabat/email-templates/confirmation.html \
            --rawfile recovery sahabat/email-templates/recovery.html \
            --rawfile magic_link sahabat/email-templates/magic-link.html \
            --rawfile email_change sahabat/email-templates/email-change.html \
            '{
              site_url: "https://www.familiamedika.id/sahabat/",
              uri_allow_list: "https://www.familiamedika.id/sahabat/,https://www.familiamedika.id/sahabat/**,https://sahabat.familiamedika.id/**",
              external_email_enabled: true,
              mailer_autoconfirm: false,
              mailer_secure_email_change_enabled: true,
              password_min_length: 12,
              smtp_sender_name: "Sahabat Familia by Familia Medika",
              mailer_subjects_confirmation: "Verifikasi Akun Sahabat Familia",
              mailer_subjects_recovery: "Atur Ulang Kata Sandi Sahabat Familia",
              mailer_subjects_magic_link: "Tautan Masuk Sahabat Familia",
              mailer_subjects_email_change: "Konfirmasi Perubahan Email Sahabat Familia",
              mailer_templates_confirmation_content: $confirmation,
              mailer_templates_recovery_content: $recovery,
              mailer_templates_magic_link_content: $magic_link,
              mailer_templates_email_change_content: $email_change
            }' > auth-config.json

          # Custom SMTP is applied only when every required secret is present.
          # This keeps credentials out of source control and allows URL/template
          # branding to be deployed independently.
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_PORT:-}" ] && \
             [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASS:-}" ] && \
             [ -n "${SMTP_ADMIN_EMAIL:-}" ]; then
            jq \
              --arg host "$SMTP_HOST" \
              --arg port "$SMTP_PORT" \
              --arg user "$SMTP_USER" \
              --arg pass "$SMTP_PASS" \
              --arg email "$SMTP_ADMIN_EMAIL" \
              '. + {
                smtp_host: $host,
                smtp_port: $port,
                smtp_user: $user,
                smtp_pass: $pass,
                smtp_admin_email: $email,
                smtp_sender_name: "Sahabat Familia by Familia Medika"
              }' auth-config.json > auth-config-with-smtp.json
            mv auth-config-with-smtp.json auth-config.json
            echo "CUSTOM_SMTP=true" >> "$GITHUB_ENV"
          else
            echo "CUSTOM_SMTP=false" >> "$GITHUB_ENV"
          fi

      - name: Apply Auth configuration
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @auth-config.json)

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase Management API returned HTTP ${status}."
            jq -r '.message // .error // .' response.json 2>/dev/null || cat response.json
            exit 1
          fi

      - name: Verify non-sensitive settings
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | jq '{
                site_url,
                uri_allow_list,
                smtp_sender_name,
                smtp_admin_email,
                mailer_subjects_confirmation,
                mailer_subjects_recovery,
                mailer_subjects_magic_link,
                mailer_subjects_email_change,
                mailer_autoconfirm,
                password_min_length
              }' | tee verified-auth-config.json

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Sahabat Familia Auth configuration applied"
            echo ""
            echo "- Production callback: https://www.familiamedika.id/sahabat/"
            echo "- Localhost removed from the application-generated callback"
            echo "- Indonesian branded subjects and templates: applied"
            echo "- Sender display name: Sahabat Familia by Familia Medika"
            if [ "${CUSTOM_SMTP}" = "true" ]; then
              echo "- Custom SMTP: applied from encrypted repository secrets"
            else
              echo "- Custom SMTP: not applied; sender address remains the Supabase relay until SAHABAT_SMTP_* secrets are configured"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
