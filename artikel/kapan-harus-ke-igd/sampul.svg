<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ilustrasi ambulans tiba di depan Instalasi Gawat Darurat rumah sakit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a59"/>
      <stop offset=".55" stop-color="#1c4a93"/>
      <stop offset="1" stop-color="#1f9fc0"/>
    </linearGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6a4d" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff6a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5fd3f3" stop-opacity=".7"/>
      <stop offset="1" stop-color="#5fd3f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sign" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebf6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d6ee"/>
      <stop offset="1" stop-color="#5f9fcc"/>
    </linearGradient>
  </defs>

  <!-- langit -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="720" cy="40" r="170" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="720" cy="40" r="110" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="40" cy="420" r="130" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>

  <!-- garis EKG -->
  <polyline fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="0,96 120,96 140,96 152,78 164,96 196,96 210,40 228,140 244,70 258,96 360,96 372,84 384,96 800,96"/>
  <circle cx="210" cy="40" r="5" fill="#fff"/>

  <!-- bangunan belakang -->
  <rect x="300" y="196" width="90" height="174" rx="4" fill="#8fb9dd" opacity=".35"/>
  <rect x="712" y="176" width="70" height="194" rx="4" fill="#8fb9dd" opacity=".35"/>

  <!-- gedung rumah sakit -->
  <rect x="380" y="150" width="340" height="220" rx="6" fill="url(#bld)"/>
  <rect x="380" y="150" width="340" height="22" rx="6" fill="#d6eef6"/>
  <!-- menara salib -->
  <rect x="520" y="104" width="60" height="50" rx="5" fill="url(#bld)"/>
  <rect x="543" y="114" width="14" height="32" rx="2" fill="#c8462a"/>
  <rect x="534" y="123" width="32" height="14" rx="2" fill="#c8462a"/>
  <!-- jendela -->
  <g fill="url(#glass)">
    <rect x="402" y="186" width="44" height="28" rx="4"/>
    <rect x="466" y="186" width="44" height="28" rx="4"/>
    <rect x="590" y="186" width="44" height="28" rx="4"/>
    <rect x="654" y="186" width="44" height="28" rx="4"/>
    <rect x="402" y="228" width="44" height="28" rx="4"/>
    <rect x="466" y="228" width="44" height="28" rx="4"/>
    <rect x="590" y="228" width="44" height="28" rx="4"/>
    <rect x="654" y="228" width="44" height="28" rx="4"/>
    <rect x="528" y="186" width="44" height="28" rx="4"/>
    <rect x="402" y="300" width="44" height="28" rx="4"/>
    <rect x="654" y="300" width="44" height="28" rx="4"/>
  </g>
  <!-- papan IGD -->
  <circle cx="550" cy="250" r="80" fill="url(#sign)"/>
  <rect x="498" y="228" width="104" height="44" rx="8" fill="#c8462a"/>
  <rect x="498" y="228" width="104" height="44" rx="8" fill="none" stroke="#ffd2c7" stroke-opacity=".6" stroke-width="2"/>
  <text x="550" y="259" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" letter-spacing="2">IGD</text>
  <!-- kanopi & pintu -->
  <rect x="456" y="282" width="188" height="14" rx="4" fill="#173a78"/>
  <rect x="466" y="296" width="6" height="74" fill="#173a78"/>
  <rect x="628" y="296" width="6" height="74" fill="#173a78"/>
  <rect x="494" y="306" width="112" height="64" rx="3" fill="url(#glass)"/>
  <rect x="549" y="306" width="2" height="64" fill="#ffffff" opacity=".7"/>
  <rect x="494" y="306" width="112" height="64" rx="3" fill="none" stroke="#173a78" stroke-width="3"/>

  <!-- jalan -->
  <rect x="0" y="368" width="800" height="82" fill="#0c2148"/>
  <rect x="0" y="368" width="800" height="6" fill="#1f9fc0" opacity=".35"/>
  <g fill="#ffffff" opacity=".35">
    <rect x="20" y="414" width="60" height="5" rx="2"/>
    <rect x="130" y="414" width="60" height="5" rx="2"/>
    <rect x="240" y="414" width="60" height="5" rx="2"/>
    <rect x="350" y="414" width="60" height="5" rx="2"/>
    <rect x="460" y="414" width="60" height="5" rx="2"/>
    <rect x="570" y="414" width="60" height="5" rx="2"/>
    <rect x="680" y="414" width="60" height="5" rx="2"/>
  </g>

  <!-- ambulans -->
  <ellipse cx="225" cy="392" rx="130" ry="9" fill="#000" opacity=".25"/>
  <circle cx="276" cy="262" r="46" fill="url(#glowR)"/>
  <circle cx="314" cy="262" r="46" fill="url(#glowB)"/>
  <!-- bak belakang -->
  <rect x="100" y="270" width="176" height="104" rx="10" fill="#ffffff"/>
  <!-- kabin -->
  <path d="M276 300 h36 q10 0 16 9 l22 32 q4 6 4 13 v12 q0 8 -8 8 h-70 z" fill="#ffffff"/>
  <path d="M286 308 h24 q6 0 10 6 l17 26 h-51 z" fill="url(#glass)"/>
  <!-- lampu sirene -->
  <rect x="270" y="258" width="18" height="12" rx="3" fill="#ff5a3c"/>
  <rect x="300" y="258" width="18" height="12" rx="3" fill="#3fb6d4"/>
  <rect x="266" y="268" width="56" height="5" rx="2" fill="#dce8f2"/>
  <!-- strip -->
  <rect x="100" y="334" width="254" height="10" fill="#c8462a"/>
  <rect x="100" y="346" width="254" height="4" fill="#173a78"/>
  <!-- salib -->
  <rect x="164" y="286" width="14" height="38" rx="2" fill="#c8462a"/>
  <rect x="152" y="298" width="38" height="14" rx="2" fill="#c8462a"/>
  <!-- jendela samping & pintu -->
  <rect x="210" y="288" width="48" height="26" rx="4" fill="url(#glass)"/>
  <rect x="276" y="300" width="2" height="62" fill="#c3d6e6"/>
  <!-- lampu depan -->
  <rect x="346" y="352" width="8" height="8" rx="2" fill="#ffd66b"/>
  <!-- roda -->
  <g>
    <circle cx="150" cy="374" r="22" fill="#14294d"/>
    <circle cx="150" cy="374" r="9" fill="#dce8f2"/>
    <circle cx="306" cy="374" r="22" fill="#14294d"/>
    <circle cx="306" cy="374" r="9" fill="#dce8f2"/>
  </g>

  <!-- lencana 119 -->
  <g transform="translate(40 150)">
    <rect width="150" height="62" rx="14" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".35"/>
    <text x="75" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#cfe6f7">DARURAT? HUBUNGI</text>
    <text x="75" y="51" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">119</text>
  </g>
</svg>
